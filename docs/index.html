<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sport Tracker Demo</title>
</head>
<body>
  <h1>Sport Tracker Demo</h1>

  <button id="btnWebcam">Webcam starten</button>
  <button id="btnStop" disabled>Stop</button>

  <div>
    <label>Video hochladen: <input id="fileVideo" type="file" accept="video/*"></label>
  </div>

  <p id="status">Bereit.</p>

  <video id="video" controls playsinline muted></video>
  <canvas id="overlay"></canvas>

  <script type="module" src="app.js"></script>
</body>
</html>
