<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sport Tracker Demo</title>
  <style>
    body{font-family:system-ui;margin:0;padding:16px;background:#111;color:#eee}
    button,input{font-size:16px;margin:6px 6px 6px 0}
    #stage{position:relative;max-width:900px}
    #video{width:100%;max-height:520px;background:#000;display:block}
    #overlay{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
  </style>
</head>
<body>
  <h1>Sport Tracker Demo</h1>

  <button id="btnWebcam">Webcam starten</button>
  <button id="btnStop" disabled>Stop</button>

  <div>
    <label>Video hochladen:
      <input id="fileVideo" type="file" accept="video/*">
    </label>
  </div>

  <p id="status">Bereit.</p>

  <div id="stage">
    <video id="video" playsinline muted controls></video>
    <canvas id="overlay"></canvas>
  </div>

  <!-- WICHTIG: nur EINMAL und ganz am Ende -->
  <script type="module" src="app.js"></script>
</body>
</html>
